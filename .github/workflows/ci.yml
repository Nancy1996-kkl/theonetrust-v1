name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Quality gate (format, lint, types, unit + coverage, tests-required, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Script and hook tests
        run: pnpm test:scripts

      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage

      - name: Tests-required gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          export TESTS_NOT_NEEDED_REASON="$(printf '%s' "$PR_BODY" | sed -n 's/^Tests-Not-Needed:[[:space:]]*//p' | head -n1)"
          pnpm check:tests-required

      - name: Whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Build
        run: pnpm build

      - name: Secrets must not reach the browser bundle
        run: |
          if grep -rEn "RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|DATABASE_URL|DIRECT_URL|AUTH_SECRET_KEY|rzp_live_" apps/web/dist; then
            echo "::error::Server-only values found in the web bundle"; exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 14

  database:
    name: Database — migrate from empty PostgreSQL, constraints, repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Plain PostgreSQL: the schema must not depend on Neon- or Supabase-only features.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theonetrust_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/theonetrust_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Database tests (wipes schema, applies every migration, checks constraints)
        run: pnpm --filter @theonetrust/api exec vitest run --config vitest.db.config.ts --coverage

      - name: Schema and migrations are in sync (no drift)
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Synthetic seed runs and is repeatable
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: development
        run: |
          pnpm db:seed
          pnpm db:seed

  e2e:
    name: E2E — 5 viewports + auto bug detector
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @theonetrust/web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
